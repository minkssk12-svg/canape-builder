<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>나만의 카나페 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--dark:#22402C;--light:#F7F5EC;--paper:#EEF0E2;--mustard:#E9C46A;--sage:#8DB596;--body:#3A4A3F;--warn:#B3261E;--steel1:#FBFCFC;--steel2:#C5CDD0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--light);color:var(--dark);font-family:'Gowun Dodum',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;margin:0}
button{font-family:'Jua',sans-serif;font-size:18px;border-radius:14px;padding:10px 16px;cursor:pointer;background:#fff;color:var(--dark);border:2px solid var(--sage);min-height:44px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
button.on{background:var(--mustard);border-color:#C9A13F}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--paper);border-bottom:2px solid var(--sage)}
header h1{font-size:28px}
.tabs{display:flex;gap:8px}
input.txt{font-size:18px;padding:8px 12px;border:2px solid var(--sage);border-radius:12px;font-family:inherit;width:190px;min-height:44px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;padding:16px 20px;max-width:1320px;margin:0 auto;align-items:start}
.stagePanel{position:sticky;top:10px;z-index:2}
@media (max-width:860px){main{grid-template-columns:1fr}}
.panel{background:#fff;border:2px solid var(--sage);border-radius:22px;padding:14px}
.panel h2{font-size:21px;margin:2px 0 8px}
#stage,#gStage{width:100%;height:auto;display:block;touch-action:none;border-radius:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:44px;align-items:center}
.hint{font-size:15px;color:var(--body)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
/* kitchen bins */
.kitchen{background:#EFE9DE;background-image:linear-gradient(#E3DBCC 2px,transparent 2px),linear-gradient(90deg,#E3DBCC 2px,transparent 2px);background-size:48px 48px;border:2px solid #CDBFA8;border-radius:22px;padding:12px}
.kitchen h2{font-size:19px;margin:4px 2px 6px;color:#4A3A26}
.shelf{display:grid;gap:8px;margin-bottom:8px}
.shelf.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.shelf.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.shelf.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.shelf.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.shelf.c6 .bin svg{max-height:62px}
#gStage{max-height:calc(100vh - 300px);min-height:300px;width:auto;max-width:100%;margin:0 auto}
#stage{max-height:calc(100vh - 250px);width:auto;max-width:100%;margin:0 auto}
@media (max-width:860px){#gStage{max-height:32vh;min-height:220px}#stage{max-height:36vh}#gFace{width:64px !important;height:64px !important;flex-basis:64px !important}.ticket .t2{font-size:18px}.stagePanel{box-shadow:0 6px 12px rgba(0,0,0,.12)}}
.bin{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 4px 5px;min-height:0;border-radius:12px;border:2px solid #98A2A6;background:linear-gradient(180deg,var(--steel1),var(--steel2));box-shadow:0 3px 0 #8E989C;touch-action:none;font-family:'Gowun Dodum',sans-serif;font-weight:700;font-size:13px;color:#2E2A22}
.bin .tray{width:100%;border-radius:8px;background:linear-gradient(180deg,#8C969A,#B8C0C3 30%,#D7DDDF);box-shadow:inset 0 3px 6px rgba(0,0,0,.35);padding:2px;display:flex;justify-content:center}
.bin svg{width:100%;height:auto;display:block;pointer-events:none}
.boardWrap{background:#E7E2D6;border-radius:18px}
.bin .lbl{margin-top:3px;line-height:1.15;text-align:center;pointer-events:none}
.bin .chip{pointer-events:none}
.bin.on{border-color:#C9A13F;box-shadow:0 3px 0 #C9A13F,0 0 0 3px #F3DE9E}
.bin:active{transform:translateY(2px);box-shadow:0 1px 0 #8E989C}
.chip{display:inline-block;font-size:10.5px;font-weight:400;border-radius:999px;padding:0 6px;border:1px solid #9AA59C;margin-top:2px}
#ghost{position:fixed;left:0;top:0;width:84px;height:84px;pointer-events:none;z-index:50;display:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
/* builder extras */
.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.g{border-radius:14px;padding:8px 4px;text-align:center;font-size:14px;border:2px dashed #B8C2B9;color:#6A766C;line-height:1.3}
.g.ok{border-style:solid;border-color:var(--dark);color:var(--dark);background:#EAF2E4}
.g b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:20px}
#advice{margin-top:10px;font-size:16px;line-height:1.5}
.warn{color:var(--warn);font-weight:700}
.stepper{display:flex;align-items:center;gap:8px;font-size:18px}
.stepper button{width:44px;padding:0}
.stepper output{font-family:'Jua',sans-serif;font-size:24px;min-width:32px;text-align:center}
#total{font-family:'Jua',sans-serif;font-size:26px;background:var(--mustard);border-radius:14px;padding:8px 14px;display:inline-block;margin:8px 0}
#shop{margin:6px 0 0;padding-left:20px;font-size:16px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(20,40,28,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal.show{display:flex}
.modal .card{background:#fff;border-radius:24px;padding:20px;max-width:520px;width:100%;text-align:center;max-height:96vh;overflow:auto}
#doneImg{width:100%;border-radius:16px;border:2px solid var(--sage)}
.btns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* game */
.hidden{display:none !important}
.wrap{max-width:1320px;margin:0 auto;padding:20px}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
.stageCard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;border-radius:22px;background:#fff}
.stageCard .num{font-size:15px;color:#4E7A55}
.stageCard h3{font-size:24px}
.stageCard p{margin:0;font-family:'Gowun Dodum',sans-serif;font-size:15px;line-height:1.5;color:var(--body);font-weight:400}
.stars{font-size:22px;color:#C9A13F;letter-spacing:2px}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.pill{font-family:'Jua',sans-serif;font-size:19px;background:#fff;border:2px solid #CDBFA8;border-radius:999px;padding:5px 14px}
.timebar{height:14px;background:#E3DBCC;border-radius:999px;overflow:hidden;margin-bottom:10px}
.timebar div{height:100%;background:var(--dark);width:100%;transition:width .1s linear}
.timebar.low div{background:var(--warn)}
.counter{display:flex;gap:12px;align-items:flex-end;margin-bottom:8px}
.ticket{flex:1;position:relative;background:#FFFDF6;border:1px solid #D9CFB8;border-radius:4px 4px 12px 12px;padding:10px 14px 12px;box-shadow:0 3px 6px rgba(60,40,20,.15);background-image:repeating-linear-gradient(#FFFDF6 0 27px,#EFE6D2 27px 28px)}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;background:radial-gradient(circle at 6px 6px,#FFFDF6 5px,transparent 5.5px) repeat-x;background-size:12px 6px}
.ticket .t1{font-size:13px;color:#8A7B5E}
.ticket .t2{font-family:'Jua',sans-serif;font-size:21px;line-height:1.35;color:#2E2A22}
.ticket .icons{display:flex;gap:4px;margin-top:4px}
.ticket .icons{flex-wrap:wrap}
.ticket .ic{display:inline-flex;align-items:center;gap:2px;background:#F3EAD6;border-radius:10px;padding:2px 8px 2px 2px;font-family:'Jua',sans-serif;font-size:18px;color:#3A2A1A}
.ticket .icons svg{width:36px;height:36px}
#gFace{width:88px;height:88px;flex:0 0 88px}
.boardWrap{position:relative}
#feedback{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-family:'Jua',sans-serif;font-size:22px;padding:6px 16px;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
#feedback.show{opacity:1}
#feedback.good{color:#2F6B2F}
#feedback.bad{color:var(--warn)}
.serveBtn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px}
.serveBtn svg{width:28px;height:28px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<header>
  <h1>나만의 카나페 만들기</h1>
  <div class="tabs">
    <button id="tabBuild" class="on">카나페 만들기</button>
    <button id="tabGame">카나페 가게 게임</button>
  </div>
</header>

<!-- BUILDER -->
<div id="buildView">
  <main>
    <section class="panel stagePanel">
      <div class="row" style="margin-bottom:8px">
        <input class="txt" id="who" placeholder="모둠 / 이름" aria-label="모둠과 이름">
        <input class="txt" id="cname" placeholder="카나페 이름" aria-label="카나페 이름">
        <button id="reset">초기화</button>
      </div>
      <svg id="stage" viewBox="0 0 500 500" role="img" aria-label="카나페 만들기 접시"></svg>
      <div class="tools" id="tools"></div>
      <p id="overflow" class="warn" style="margin:6px 0 0"></p>
    </section>
    <section style="display:flex;flex-direction:column;gap:14px">
      <div class="kitchen">
        <h2>① 바탕 (끌어다 접시에 놓기)</h2>
        <div class="shelf c3" id="bases"></div>
        <h2>② 바르기</h2>
        <div class="shelf c4" id="spreads"></div>
        <h2>③ 토핑</h2>
        <div class="shelf c5" id="palette"></div>
      </div>
      <div class="panel">
        <h2>④ 식품군 점검</h2>
        <div class="groups" id="groups"></div>
        <div id="advice"></div>
      </div>
      <div class="panel">
        <h2>⑤ 몇 개 필요할까?</h2>
        <div class="row" style="gap:20px">
          <div class="stepper">한 사람 <button data-k="per" data-d="-1" aria-label="한 사람 개수 줄이기">−</button><output id="per">2</output><button data-k="per" data-d="1" aria-label="한 사람 개수 늘리기">+</button>개</div>
          <div class="stepper">모둠원 <button data-k="mem" data-d="-1" aria-label="모둠원 수 줄이기">−</button><output id="mem">4</output><button data-k="mem" data-d="1" aria-label="모둠원 수 늘리기">+</button>명</div>
        </div>
        <div id="formula" class="hint"></div>
        <div id="total"></div>
        <ul id="shop"></ul>
        <div class="row" style="margin-top:12px"><button class="primary" id="finish">완성하기</button></div>
      </div>
    </section>
  </main>
</div>

<!-- GAME -->
<div id="gameView" class="hidden">
  <div class="wrap" id="gMenu">
    <h2 style="font-size:32px">카나페 가게</h2>
    <p class="hint" style="font-size:17px;margin:6px 0 0">주문서를 보고 재료 통에서 크래커, 소스, 토핑을 도마로 끌어다 놓아 카나페를 만들어요. 틀리게 내면 5초가 줄어들어요!</p>
    <div class="stages" id="stageList"></div>
  </div>
  <div class="hidden" id="gPlay">
    <main>
      <section class="panel stagePanel" style="background:#FBF7EE;border-color:#CDBFA8">
        <div class="gbar">
          <span class="pill" id="gStageName"></span>
          <span class="pill" id="gServed"></span>
          <span class="pill" id="gCoins"></span>
        </div>
        <div class="timebar" id="gTimeBar"><div></div></div>
        <div class="counter">
          <svg id="gFace" viewBox="0 0 88 88" aria-hidden="true"></svg>
          <div class="ticket"><div class="t1" id="gTicketNo"></div><div class="t2" id="gOrder"></div><div class="icons" id="gIcons"></div></div>
        </div>
        <div class="boardWrap">
          <svg id="gStage" viewBox="40 40 420 450" role="img" aria-label="도마 위 카나페"></svg>
          <div id="feedback"></div>
        </div>
        <div class="row" style="margin-top:8px;margin-bottom:0">
          <button class="primary serveBtn" id="gServe" style="flex:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 18h16M6 18a6 6 0 0 1 12 0M12 9V7M10 6h4"/></svg>손님에게 내기</button>
          <button id="gClear">도마 비우기</button>
          <button id="gQuit">그만하기</button>
        </div>
      </section>
      <section class="kitchen">
        <h2>크래커 · 바르기</h2>
        <div class="shelf c6" id="gBaseSpread"><div id="gBases" style="display:contents"></div><div id="gSpreads" style="display:contents"></div></div>
        <h2>토핑 <span class="hint">(최대 6개)</span></h2>
        <div class="shelf c5" id="gPalette"></div>
      </section>
    </main>
  </div>
</div>

<div id="ghost"></div>

<div class="modal" id="done" role="dialog" aria-modal="true" aria-label="완성 카드">
  <div class="card">
    <h2 style="font-size:28px;margin-bottom:10px">완성!</h2>
    <img id="doneImg" alt="완성한 카나페 카드">
    <div class="btns"><button class="primary" id="save">이미지로 저장</button><button id="close">계속 고치기</button></div>
  </div>
</div>
<div class="modal" id="gEnd" role="dialog" aria-modal="true" aria-label="단계 결과">
  <div class="card">
    <h2 id="gEndTitle" style="font-size:32px"></h2>
    <div class="stars" id="gEndStars" style="font-size:40px;margin:8px 0"></div>
    <p id="gEndMsg" style="font-size:18px;line-height:1.6;margin:0"></p>
    <p id="gEndTip" style="font-size:16px;line-height:1.6;background:var(--paper);border-radius:14px;padding:12px;margin:12px 0 0;text-align:left"></p>
    <div class="btns"><button class="primary" id="gNext">다음 단계</button><button id="gRetry">다시 하기</button><button id="gToMenu">단계 선택</button></div>
  </div>
</div>

<script>
/* ===== ART: gradients, ingredient symbols, bases ===== */
const GRAD = `
<linearGradient id="k-cheese" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEDA8"/><stop offset="1" stop-color="#F2B935"/></linearGradient>
<radialGradient id="k-cream" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9E1CC"/></radialGradient>
<radialGradient id="k-white" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E0D4"/></radialGradient>
<radialGradient id="k-yolk" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#FFE68A"/><stop offset="1" stop-color="#EE9F00"/></radialGradient>
<radialGradient id="k-ham" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FCCAD2"/><stop offset="1" stop-color="#DC7489"/></radialGradient>
<radialGradient id="k-tuna" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#F4DCC0"/><stop offset="1" stop-color="#C58E62"/></radialGradient>
<linearGradient id="k-salmon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB894"/><stop offset="1" stop-color="#EA5F2F"/></linearGradient>
<radialGradient id="k-tomato" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FF8E78"/><stop offset="1" stop-color="#C9201A"/></radialGradient>
<radialGradient id="k-cuke" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#F6FCE8"/><stop offset="1" stop-color="#B7DA8A"/></radialGradient>
<radialGradient id="k-carrot" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#FFC47E"/><stop offset="1" stop-color="#EC7012"/></radialGradient>
<radialGradient id="k-pickle" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#DCE59A"/><stop offset="1" stop-color="#86A040"/></radialGradient>
<radialGradient id="k-kiwi" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#E2F2A6"/><stop offset="1" stop-color="#6FAE2E"/></radialGradient>
<radialGradient id="k-straw" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FF7C88"/><stop offset="1" stop-color="#C8172F"/></radialGradient>
<radialGradient id="k-strawin" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#FFF0EE"/><stop offset="1" stop-color="#F27E8B"/></radialGradient>
<radialGradient id="k-banana" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#FFFBE6"/><stop offset="1" stop-color="#F1DC96"/></radialGradient>
<radialGradient id="k-blue" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8E9CE6"/><stop offset="1" stop-color="#2B3580"/></radialGradient>
<radialGradient id="k-apple" cx=".4" cy=".4" r=".8"><stop offset="0" stop-color="#FFFBEE"/><stop offset="1" stop-color="#F0D99E"/></radialGradient>
<linearGradient id="k-appleskin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5483B"/><stop offset="1" stop-color="#9E171B"/></linearGradient>
<linearGradient id="k-pepR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A55"/><stop offset="1" stop-color="#C11A10"/></linearGradient>
<linearGradient id="k-pepY" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE77A"/><stop offset="1" stop-color="#E3A200"/></linearGradient>
<linearGradient id="k-marsh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7E3EC"/><stop offset=".45" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EBCFDC"/></linearGradient>
<radialGradient id="k-jam" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#EE4E64"/><stop offset="1" stop-color="#8A0C22"/></radialGradient>
<radialGradient id="k-mayo" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FFFDF0"/><stop offset="1" stop-color="#EEDDA0"/></radialGradient>
<linearGradient id="k-crab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8360"/><stop offset="1" stop-color="#DD3A1E"/></linearGradient>
<radialGradient id="k-crk" cx=".45" cy=".4" r=".75"><stop offset="0" stop-color="#FBE0AA"/><stop offset=".75" stop-color="#E9B66C"/><stop offset="1" stop-color="#C98940"/></radialGradient>
<radialGradient id="k-ritz" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#F8CF86"/><stop offset=".8" stop-color="#DE9A48"/><stop offset="1" stop-color="#B86E2A"/></radialGradient>
<linearGradient id="k-crust" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9964F"/><stop offset="1" stop-color="#93561F"/></linearGradient>
<radialGradient id="k-crumb" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#FFF8E6"/><stop offset="1" stop-color="#F1DCAE"/></radialGradient>
<radialGradient id="k-plate" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".85" stop-color="#F1F2EE"/><stop offset="1" stop-color="#D8DBD3"/></radialGradient>
<linearGradient id="k-wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2B57B"/><stop offset="1" stop-color="#B7844C"/></linearGradient>
<linearGradient id="k-table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A27A"/><stop offset="1" stop-color="#A97F58"/></linearGradient>
`;

const SH = (rx,ry,cy=47) => `<ellipse cx="42" cy="${cy}" rx="${rx}" ry="${ry}" fill="#3A2412" opacity=".18"/>`;
function ring(n, r, cx, cy, fn){ let o=''; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; o+=fn(cx+Math.cos(a)*r, cy+Math.sin(a)*r, a*180/Math.PI); } return o; }
function wavy(cx,cy,rx,ry,n,amp){ let d=''; for(let i=0;i<=n*4;i++){ const a=i/(n*4)*Math.PI*2, k=1+amp*Math.sin(a*n); d+=(i?'L':'M')+(cx+Math.cos(a)*rx*k).toFixed(1)+' '+(cy+Math.sin(a)*ry*k).toFixed(1)+' '; } return d+'Z'; }

function scallop(cx,cy,r,n,b){ let d=''; for(let i=0;i<n;i++){ const a1=i/n*Math.PI*2, a2=(i+1)/n*Math.PI*2, am=(a1+a2)/2;
  const p1=[cx+Math.cos(a1)*r, cy+Math.sin(a1)*r], p2=[cx+Math.cos(a2)*r, cy+Math.sin(a2)*r], c=[cx+Math.cos(am)*(r+b), cy+Math.sin(am)*(r+b)];
  d+=(i?'':`M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} `)+`Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} `; } return d+'Z'; }

function drawCanape(s, selIdx, mode){
  let h = mode==='board' ? BOARD_BG : PLATE_BG;
  if (s.base){
    h += BASE_ART[s.base];
    if (SPREAD_ART[s.spread]) h += SPREAD_ART[s.spread](s.base);
  }
  s.items.forEach((it,idx)=>{
    const w = 80*it.s;
    h += `<g data-idx="${idx}" style="cursor:grab"><rect x="${it.x-w/2}" y="${it.y-w/2}" width="${w}" height="${w}" fill="transparent"/>${useT(it.t, it.x-w/2, it.y-w/2, w, it.r)}`;
    if (idx===selIdx) h += `<circle cx="${it.x}" cy="${it.y}" r="${w*0.56}" fill="none" stroke="#22402C" stroke-width="3" stroke-dasharray="7 5"/>`;
    h += '</g>';
  });
  return h;
}
function groupsOf(s){
  const used = new Set();
  if (s.base) used.add(BASES[s.base].g);
  if (SPREADS[s.spread].g) used.add(SPREADS[s.spread].g);
  s.items.forEach(it=>used.add(TOPPINGS[it.t].g));
  return used;
}
function toSVG(svgEl, cx, cy){
  const r = svgEl.getBoundingClientRect(), vb = svgEl.viewBox.baseVal;
  if (cx<r.left||cx>r.right||cy<r.top||cy>r.bottom) return null;
  return {x: vb.x + (cx-r.left)*vb.width/r.width, y: vb.y + (cy-r.top)*vb.height/r.height};
}

/* ---------- drag from bins ---------- */
const ghost = $('ghost');
function ghostSVG(kind,key){
  if (kind==='top') return `<svg viewBox="0 0 80 80" width="84" height="84"><use href="#${TOPPINGS[key].id}"/></svg>`;
  if (kind==='base') return `<svg viewBox="130 130 240 240" width="84" height="84">${BASE_ART[key]}</svg>`;
  return `<svg viewBox="0 0 80 70" width="84" height="74">${key==='none'?'':jarSVG(key)}</svg>`;
}
function enableBins(container, onTap, onDrop){
  container.addEventListener('pointerdown', e=>{
    const b = e.target.closest('.bin'); if (!b) return;
    e.preventDefault();
    const kind=b.dataset.kind, key = kind==='top' ? +b.dataset.key : b.dataset.key;
    const sx=e.clientX, sy=e.clientY; let moved=false;
    b.setPointerCapture(e.pointerId);
    const move = ev=>{
      if (!moved && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 8){ moved=true; ghost.innerHTML=ghostSVG(kind,key); ghost.style.display='block'; }
      if (moved) ghost.style.transform = `translate(${ev.clientX-42}px, ${ev.clientY-42}px)`;
    };
    const up = ev=>{
      b.removeEventListener('pointermove',move); b.removeEventListener('pointerup',up); b.removeEventListener('pointercancel',up);
      ghost.style.display='none';
      if (ev.type==='pointercancel') return;
      if (moved) onDrop(kind,key,ev.clientX,ev.clientY); else onTap(kind,key);
    };
    b.addEventListener('pointermove',move); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
  });
}

const st = {base:'square', spread:'none', items:[], sel:-1, per:2, mem:4};
const stage = $('stage');
function buildControls(){
  $('bases').innerHTML = Object.keys(BASES).map(baseBin).join('');
  $('spreads').innerHTML = noneBin() + ['jam','cream','mayo'].map(spreadBin).join('');
  $('palette').innerHTML = TOPPINGS.map((t,i)=>topBin(i)).join('');
  document.querySelectorAll('#buildView .stepper button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; st[k]=Math.max(1,Math.min(k==='per'?10:12,st[k]+ +b.dataset.d)); render();
  });
  const tap = (kind,key)=>{
    if (kind==='base') st.base=key; else if (kind==='spread') st.spread=key;
    else { const a=Math.random()*Math.PI*2, r=8+Math.random()*36; st.items.push({t:key,x:250+Math.cos(a)*r,y:250+Math.sin(a)*r,s:1.1,r:Math.round(Math.random()*40-20)}); st.sel=st.items.length-1; }
    render();
  };
  const drop = (kind,key,cx,cy)=>{
    const p = toSVG(stage,cx,cy); if (!p) return;

    st.items.push({t:key,x:p.x,y:p.y,s:1.1,r:Math.round(Math.random()*40-20)}); st.sel=st.items.length-1; render();

function render(){
  stage.innerHTML = drawCanape(st, st.sel, 'plate');

  document.querySelectorAll('#spreads .bin').forEach(b=>b.classList.toggle('on', b.dataset.key===st.spread));

    tools.innerHTML = `<b class="jua" style="font-size:18px">${TOPPINGS[st.items[st.sel].t].name}</b><button data-act="big">크게</button><button data-act="small">작게</button><button data-act="rot">돌리기</button><button data-act="del">빼기</button>`;
    tools.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  } else tools.innerHTML = '<span class="hint">재료 통을 누르거나 접시로 끌어다 놓아요. 올린 토핑은 끌어서 옮겨요.</span>';
  const B = BASES[st.base];

  $('overflow').textContent = out ? `토핑 ${out}개가 크래커 밖으로 나갔어요. 진짜로 만들면 떨어져요!` : (st.items.length>6 ? '토핑이 너무 많아요. 한 입에 쏙 들어갈까요?' : '');
  const used = groupsOf(st);

  const miss = GROUPS.filter(G=>!used.has(G.k));
  $('advice').innerHTML = !miss.length ? '<b>5가지 식품군을 모두 담았어요!</b> 균형 잡힌 건강 간식이에요.' :
    miss.map(G=>{ const ex=TOPPINGS.filter(t=>t.g===G.k).slice(0,3).map(t=>t.name).join(', '); return `· <b>${G.name}</b>이(가) 빠졌어요. ${ex?ex+' 중 하나를 올려 볼까요?':''}`; }).join('<br>') + `<br><span class="hint">지금 ${used.size}가지 식품군이 들어 있어요.</span>`;
  $('per').textContent=st.per; $('mem').textContent=st.mem;
  const total = st.per*(st.mem+2);
  $('formula').textContent = `${st.per}개 × (모둠원 ${st.mem}명 + 2) =`;
  $('total').textContent = `카나페 ${total}개 필요`;
  const counts = {}; st.items.forEach(it=>{const n=TOPPINGS[it.t].name; counts[n]=(counts[n]||0)+1;});
  let shop = `<li>${B.name} ${total}${st.base==='bread'?'조각 (식빵 '+Math.ceil(total/4)+'장)':'개'}</li>`;
  if (SPREAD_ART[st.spread]) shop += `<li>${SPREADS[st.spread].name}: 카나페 ${total}개에 바를 만큼</li>`;
  shop += Object.entries(counts).map(([n,c])=>`<li>${n} ${c*total}조각 (카나페 1개에 ${c}조각)</li>`).join('');
  $('shop').innerHTML = shop;
}
function act(a){
  const it = st.items[st.sel]; if (!it) return;
  if (a==='big') it.s=Math.min(1.8,it.s+0.12);
  if (a==='small') it.s=Math.max(0.6,it.s-0.12);
  if (a==='rot') it.r=(it.r+30)%360;
  if (a==='del'){ st.items.splice(st.sel,1); st.sel=-1; }
  render();
}
let drag=null;
stage.addEventListener('pointerdown', e=>{
  const g = e.target.closest('g[data-idx]');
  if (!g){ st.sel=-1; render(); return; }
  const idx=+g.dataset.idx, p=toSVG(stage,e.clientX,e.clientY), it=st.items[idx];
  st.items.splice(idx,1); st.items.push(it); st.sel=st.items.length-1;
  drag={dx:p.x-it.x, dy:p.y-it.y, pid:e.pointerId};
  stage.setPointerCapture(e.pointerId); render();
});
stage.addEventListener('pointermove', e=>{
  if (!drag||e.pointerId!==drag.pid) return;
  const r=stage.getBoundingClientRect(), it=st.items[st.sel];
  const x=(e.clientX-r.left)*500/r.width, y=(e.clientY-r.top)*500/r.height;
  it.x=Math.max(20,Math.min(480,x-drag.dx)); it.y=Math.max(20,Math.min(480,y-drag.dy));
  stage.innerHTML = drawCanape(st, st.sel, 'plate');
});
const endDrag=()=>{ if(drag){ drag=null; render(); } };
stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);

const hasBatchim = w => { const c=w.charCodeAt(w.length-1); return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0; };
const josa = (w,a,b) => w+(hasBatchim(w)?a:b);
const listKo = arr => arr.map((w,i)=> i<arr.length-1 ? josa(w,'이랑','랑') : w).join(' ');
const tops = s => s.items.map(it=>TOPPINGS[it.t].name);

const usesAny = (s,names) => names.find(n => tops(s).includes(n) || SPREADS[s.spread].name===n);
const FRUITS = ['키위','딸기','바나나','블루베리','사과'];
const few = (name,n) => n===0 ? `${josa(name,'이','가')} 없어요.` : `${josa(name,'이','가')} ${n}가지뿐이에요.`;

const UNIT = {'슬라이스 치즈':'장','햄':'장','연어':'조각'};
const unit = n => UNIT[n]||'개';
function exact(base, spread, list){
  const sp = SPREADS[spread];
  const phrase = listKo(list.map(([n,c])=>`${n} ${c}${unit(n)}`));
  const say = `${BASES[base].name}에 ` + (SPREAD_ART[spread] ? `${josa(sp.name,'을','를')} 바르고 ` : '아무것도 바르지 말고 ') + `${josa(phrase,'을','를')} 올려 주세요!`;
  return {say, icons:list, check:s=>{
    if (s.base!==base) return `바탕은 ${josa(BASES[base].name,'이에요','예요')}.`;
    if (s.spread!==spread) return SPREAD_ART[spread] ? `${josa(sp.name,'을','를')} 발라야 해요.` : '아무것도 바르지 않아야 해요.';
    const c = {}; tops(s).forEach(n=>c[n]=(c[n]||0)+1);
    for (const [n,k] of list){
      const have=c[n]||0;
      if (!have) return `${josa(n,'이','가')} 빠졌어요.`;
      if (have!==k) return `${josa(n,'은','는')} ${josa(k+unit(n),'이에요','예요')}. 지금 ${have}${unit(n)} 올렸어요.`;
    }
    const extra = Object.keys(c).filter(n=>!list.some(([m])=>m===n) && n!==sp.name);
    if (extra.length) return `${josa(extra[0],'은','는')} 주문하지 않았어요.`;
    return null;
  }};
}

   ]},
  {name:'영양소 손님', desc:'영양소 이름만 말하는 손님! 어떤 식품군인지 떠올리기', time:120, goal:4,
   tip:'탄수화물은 곡류, 단백질은 고기·생선·달걀·콩류, 비타민은 채소·과일, 칼슘(무기질)은 우유·유제품, 지방은 유지·당류에 많아요.',
   pool:()=>[
     need('뼈와 이를 튼튼하게! 칼슘이 많은 재료를 넣어 주세요.', s=> groupsOf(s).has('우') ? null : nmiss('우')),
     need('몸을 만드는 단백질을 2개 올려 주세요.', s=> cnt(s,'단')>=2 ? null : (cnt(s,'단') ? `단백질 재료가 ${cnt(s,'단')}개뿐이에요. ` + nwhere('단') : nmiss('단'))),
     need('감기 기운이 있어요. 비타민이 많은 재료를 3개 올려 주세요.', s=> cnt(s,'채')>=3 ? null : (cnt(s,'채') ? `비타민 재료가 ${cnt(s,'채')}개뿐이에요. ` + nwhere('채') : nmiss('채'))),
     need('지방은 빼 주세요! 대신 단백질이랑 비타민은 꼭 넣어 주세요.', s=> groupsOf(s).has('유') ? '지방이 들어 있어요. ' + nwhere('유') : cnt(s,'단')<1 ? nmiss('단') : cnt(s,'채')<1 ? nmiss('채') : null),
     need('운동하고 왔어요! 탄수화물, 단백질, 칼슘이 필요해요.', s=> cnt(s,'단')<1 ? nmiss('단') : !groupsOf(s).has('우') ? nmiss('우') : null),
     need('탄수화물, 단백질, 지방, 비타민, 칼슘을 모두 담아 주세요!', s=>{ const u=groupsOf(s); const m=['곡','단','유','채','우'].find(k=>!u.has(k)); return m ? nmiss(m) : null; }),
     need('눈 건강에 좋은 비타민 A! 주황색 채소를 2개 올려 주세요.', s=>{ const c=tops(s).filter(n=>n==='당근').length; return c>=2 ? null : `주황색 채소(당근)가 ${c}개예요. 2개!`; })
   ]},
  {name:'점심 러시', desc:'손님이 몰려와요! 섞인 주문을 빠르게', time:130, goal:6,
   tip:'오늘 배운 것: 주문 확인 → 개수 확인 → 식품군·영양소 균형 → 알레르기 확인. 내일 실습에서도 그대로 해 봐요!',
   pool:()=>[...STAGES[0].pool().slice(0,3), ...STAGES[1].pool(), ...STAGES[2].pool(), ...STAGES[3].pool(), ...STAGES[4].pool()]}
];

let memStars={};
const store={ get(){ try{ return Object.assign({},memStars,JSON.parse(localStorage.getItem('canapeStars')||'{}')); }catch(e){ return Object.assign({},memStars); } },
              set(v){ memStars=v; try{ localStorage.setItem('canapeStars',JSON.stringify(v)); }catch(e){} } };
const g = {stage:0, queue:[], order:null, served:0, coins:0, timeLeft:0, timer:null, base:null, spread:'none', items:[], mood:'wait', fbT:null};

function showMenu(){
  $('gMenu').classList.remove('hidden'); $('gPlay').classList.add('hidden');
  const stars=store.get();
  $('stageList').innerHTML = STAGES.map((S,i)=>{
    const locked = i>0 && !stars[i-1], sc=stars[i]||0;
    return `<button class="stageCard" data-stage="${i}" ${locked?'disabled':''}><span class="num">${i+1}단계</span><h3>${S.name}</h3><p>${S.desc}<br>손님 ${S.goal}명 · ${S.time}초</p><span class="stars">${locked?'잠김':'★'.repeat(sc)+'☆'.repeat(3-sc)}</span></button>`;
  }).join('');
  $('stageList').querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>startStage(+b.dataset.stage));
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startStage(i){
  const S=STAGES[i]; let q=shuffle(S.pool()); while(q.length<S.goal) q=q.concat(shuffle(S.pool()));
  Object.assign(g,{stage:i, queue:q.slice(0,S.goal), served:0, coins:0, timeLeft:S.time});
  $('gMenu').classList.add('hidden'); $('gPlay').classList.remove('hidden'); $('gEnd').classList.remove('show');
  $('gStageName').textContent=`${i+1}단계 · ${S.name}`;
  nextOrder(); clearInterval(g.timer); g.timer=setInterval(tick,100);
}
const SKIN=['#F6D3B5','#EEC19A','#D9A27A','#F3CDB0','#E5B18C'], HAIR=['#3B2A20','#1F1A17','#7A4A2A','#5A3A2A','#2B2B33'], SHIRT=['#5E8FC9','#8DB596','#E9C46A','#D77A8C','#9A84C9'];
function faceSVG(n, mood){
  const sk=SKIN[n%5], hr=HAIR[(n*3)%5], sh=SHIRT[(n*2)%5], style=n%4;
  const hair = [
    `<path d="M20 40 C18 18 70 14 68 40 C64 30 56 26 44 26 C32 26 24 30 20 40 Z" fill="${hr}"/>`,
    `<path d="M18 46 C14 16 74 14 70 46 L70 58 C66 50 66 40 62 34 C52 28 36 28 26 34 C22 40 22 50 18 58 Z" fill="${hr}"/>`,
    `<path d="M20 40 C18 18 70 14 68 40 C64 30 56 26 44 26 C32 26 24 30 20 40 Z" fill="${hr}"/><circle cx="70" cy="30" r="9" fill="${hr}"/>`,
    `<path d="M18 36 C20 14 68 14 70 36 Z" fill="${sh}"/><rect x="14" y="32" width="48" height="6" rx="3" fill="${sh}"/>`
  ][style];
  const mouth = mood==='happy' ? '<path d="M34 54 Q44 64 54 54" fill="#B23A3A" stroke="#5A2A1A" stroke-width="2"/>' : mood==='sad' ? '<path d="M35 58 Q44 51 53 58" fill="none" stroke="#5A2A1A" stroke-width="2.5" stroke-linecap="round"/>' : '<path d="M37 55 Q44 59 51 55" fill="none" stroke="#5A2A1A" stroke-width="2.5" stroke-linecap="round"/>';
  const brow = mood==='sad' ? '<path d="M30 34 L38 37 M58 34 L50 37" stroke="#3A2A1A" stroke-width="2" stroke-linecap="round"/>' : '';
  return `<rect x="0" y="0" width="88" height="88" rx="18" fill="#F3E7D2"/><path d="M14 88 C16 70 72 70 74 88 Z" fill="${sh}"/><rect x="38" y="62" width="12" height="10" fill="${sk}"/><ellipse cx="44" cy="44" rx="24" ry="25" fill="${sk}"/><ellipse cx="20" cy="46" rx="4" ry="6" fill="${sk}"/><ellipse cx="68" cy="46" rx="4" ry="6" fill="${sk}"/>${hair}${brow}<ellipse cx="35" cy="43" rx="3" ry="3.6" fill="#2A1E16"/><ellipse cx="53" cy="43" rx="3" ry="3.6" fill="#2A1E16"/><circle cx="36" cy="42" r="1" fill="#fff"/><circle cx="54" cy="42" r="1" fill="#fff"/><ellipse cx="29" cy="52" rx="4" ry="2.5" fill="#F29C9C" opacity=".55"/><ellipse cx="59" cy="52" rx="4" ry="2.5" fill="#F29C9C" opacity=".55"/>${mouth}`;
}
function nextOrder(){
  g.order=g.queue[g.served]; g.mood='wait'; clearBoard();
  $('gTicketNo').textContent=`주문서 No.${String(g.stage+1)}-${g.served+1}`;
  $('gOrder').textContent=g.order.say;
  $('gIcons').innerHTML=(g.order.icons||[]).map(([n,c])=>`<span class="ic"><svg viewBox="0 0 80 80" aria-hidden="true"><use href="#${TOPPINGS[TIDX[n]].id}"/></svg>×${c}</span>`).join('');
  drawFace();
}
function drawFace(){ $('gFace').innerHTML=faceSVG(g.stage*7+g.served*3+1, g.mood); }
function tick(){ g.timeLeft=Math.max(0,g.timeLeft-0.1); renderTime(); if(g.timeLeft<=0) endStage(false); }
function renderTime(){ const pct=g.timeLeft/STAGES[g.stage].time*100; $('gTimeBar').firstElementChild.style.width=pct+'%'; $('gTimeBar').classList.toggle('low',pct<25); }
function clearBoard(){ g.base=null; g.spread='none'; g.items=[]; renderGame(); }
function renderGame(){
  const s={base:g.base, spread:g.spread, items:g.items};
  $('gStage').innerHTML=drawCanape(s,-1,'board');
  document.querySelectorAll('#gBases .bin').forEach(b=>b.classList.toggle('on',b.dataset.key===g.base));
  document.querySelectorAll('#gSpreads .bin').forEach(b=>b.classList.toggle('on',g.base && b.dataset.key===g.spread && g.spread!=='none'));
  $('gServed').textContent=`손님 ${g.served}/${STAGES[g.stage].goal}`;
  $('gCoins').textContent=`코인 ${g.coins}`;
}
const SLOTS=[[250,250],[205,207],[295,293],[295,207],[205,293],[250,198]];
function gAdd(kind,key,p){
  if (kind==='base'){ g.base=key; return renderGame(); }
  if (!g.base) return fb('bad','먼저 크래커를 도마에 올려요.');
  if (kind==='spread'){ g.spread=key; return renderGame(); }
  if (g.items.length>=6) return fb('bad','토핑은 6개까지만!');
  if (p && !BASES[g.base].inside(p.x,p.y)) return fb('bad','크래커 위에 올려 주세요.');
  const pos = p || {x:SLOTS[g.items.length][0], y:SLOTS[g.items.length][1]};
  g.items.push({t:key, x:pos.x, y:pos.y, s:1.0, r:Math.round(Math.random()*50-25)});
  renderGame();
}
function serve(){
  if (!g.base) return fb('bad','도마가 비어 있어요.');
  const s={base:g.base, spread:g.spread, items:g.items};
  const why=g.order.check(s);
  if (why){ g.timeLeft=Math.max(0,g.timeLeft-5); renderTime(); g.mood='sad'; drawFace(); fb('bad',`앗! ${why} (−5초)`); if(g.timeLeft<=0) endStage(false); return; }
  const bonus=Math.round(g.timeLeft); g.coins+=100+bonus; g.served++;
  g.mood='happy'; drawFace(); fb('good',`맛있어요! +${100+bonus}`);
  if (g.served>=STAGES[g.stage].goal){ renderGame(); clearInterval(g.timer); setTimeout(()=>endStage(true),700); return; }
  setTimeout(()=>{ if(!$('gPlay').classList.contains('hidden')) nextOrder(); },700);
}
function fb(cls,msg){ const f=$('feedback'); f.className=cls+' show'; f.textContent=msg; clearTimeout(g.fbT); g.fbT=setTimeout(()=>f.classList.remove('show'),2200); }
function endStage(win){
  clearInterval(g.timer);
  const S=STAGES[g.stage]; let n=0;
  if (win){ const r=g.timeLeft/S.time; n=r>=0.5?3:r>=0.25?2:1; const all=store.get(); all[g.stage]=Math.max(all[g.stage]||0,n); store.set(all); }
  $('gEndTitle').textContent = win ? `${g.stage+1}단계 성공!` : '시간이 다 됐어요';
  $('gEndStars').textContent = win ? '★'.repeat(n)+'☆'.repeat(3-n) : '';
  $('gEndMsg').textContent = win ? `손님 ${S.goal}명에게 모두 대접했어요. 코인 ${g.coins}개, 남은 시간 ${Math.round(g.timeLeft)}초` : `손님 ${g.served}/${S.goal}명에게 대접했어요. 다시 도전해 봐요!`;
  $('gEndTip').textContent='영양 한마디: '+S.tip;
  $('gNext').classList.toggle('hidden', !win || g.stage>=STAGES.length-1);
  $('gEnd').classList.add('show');
}
function buildGame(){
  $('gBases').innerHTML=Object.keys(BASES).map(baseBin).join('');
  $('gSpreads').innerHTML=['jam','cream','mayo'].map(spreadBin).join('');
  $('gPalette').innerHTML=TOPPINGS.map((t,i)=>topBin(i)).join('');
  const tap=(kind,key)=>gAdd(kind,key,null);
  const drop=(kind,key,cx,cy)=>{ const p=toSVG($('gStage'),cx,cy); if(!p) return; gAdd(kind,key, kind==='top'?p:null); };
  ['gBaseSpread','gPalette'].forEach(id=>enableBins($(id),tap,drop));
  $('gServe').onclick=serve; $('gClear').onclick=clearBoard;
  $('gQuit').onclick=()=>{ clearInterval(g.timer); showMenu(); };
  $('gRetry').onclick=()=>startStage(g.stage);
  $('gNext').onclick=()=>startStage(g.stage+1);
  $('gToMenu').onclick=()=>{ $('gEnd').classList.remove('show'); showMenu(); };
}

$('tabBuild').onclick=()=>{ clearInterval(g.timer); $('buildView').classList.remove('hidden'); $('gameView').classList.add('hidden'); $('gEnd').classList.remove('show'); $('tabBuild').classList.add('on'); $('tabGame').classList.remove('on'); };
$('tabGame').onclick=()=>{ $('buildView').classList.add('hidden'); $('gameView').classList.remove('hidden'); $('tabGame').classList.add('on'); $('tabBuild').classList.remove('on'); showMenu(); };

buildControls(); render(); buildGame();
</script>
